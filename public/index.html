<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="./styles/output.css">
    <link rel="icon" href="./images/favicon.png" type="image/png">
</head>

<body class="bg-slate-900 m-0 font-[Manrope] font-medium text-white flex flex-col justify-between">
    <header class="flex items-center w-full p-5 bg-indigo-600">
        <h1 class="text-[1.2rem]">Todo List</h1>
    </header>
    <main class="flex justify-center mx-10 my-5">
        <section
            class="w-full min-[410px]:w-4/5 min-[500px]:w-2/3 min-[600px]:w-1/2 p-3 sm:w-2/5 md:w-1/3 lg:w-1/4 min-h-96 bg-white/5 rounded-2xl">
            <h3 class="pb-2 m-0 text-[1rem] font-light border-b border-white/10">TODO</h3>
            <div id="interative-section" class="flex flex-col justify-between min-h-80">
                <ul id="todoList" class="p-0 list-none"></ul>
                <section>
                    <form id="todoForm" action="">
                        <input id="todoInput" type="text" placeholder="Enter a todo"
                            class="w-full p-2 mb-2 border-2 border-indigo-500 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-900 placeholder:text-slate-500">
                        <button id="btn"
                            class="w-full p-2 text-white bg-indigo-600 border-0 rounded-lg cursor-pointer hover:bg-indigo-700">Add</button>
                    </form>
            </div>
        </section>
        </section>
    </main>
    <footer class="flex flex-col items-center w-full p-10 bg-indigo-600 h-5mb-0">
        <p class="mt-0 mb-1 font-light">Usman Iqbal @ <span id="date"></span></p>
        <p class="my-0 font-light text-center">Made using <span class="font-bold">TypeScript</span> and <span
                class="font-bold">Tailwind CSS</span></p>
    </footer>
    <script src="./dist/index.js"></script>
</body>

</html>
